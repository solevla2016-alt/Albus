x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    # The host has 1.9 GB of RAM and already runs another stack, so the
    # postgres defaults (128 MB shared_buffers plus per-connection work_mem)
    # are a real OOM risk here.
    command: >
      postgres
      -c shared_buffers=48MB
      -c max_connections=40
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    # noeviction: channel-layer state must never be dropped to stay under memory
    command: redis-server --maxmemory 96mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: albus-backend:latest
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      SESSION_COOKIE_SECURE: "True"
      SESSION_COOKIE_SAMESITE: "Lax"
      CSRF_COOKIE_SECURE: "True"
      CSRF_COOKIE_SAMESITE: "Lax"
      GIGACHAT_CLIENT_ID: ${GIGACHAT_CLIENT_ID}
      GIGACHAT_CLIENT_SECRET: ${GIGACHAT_CLIENT_SECRET}
      GIGACHAT_VERIFY_SSL: ${GIGACHAT_VERIFY_SSL:-False}
      GIGACHAT_USERNAME: ${GIGACHAT_USERNAME}
      GIGACHAT_PASSWORD: ${GIGACHAT_PASSWORD}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-Pro:latest}
      YANDEX_MAIL_USERNAME: ${YANDEX_MAIL_USERNAME}
      YANDEX_MAIL_PASSWORD: ${YANDEX_MAIL_PASSWORD}
      YANDEX_MAIL_FROM: ${YANDEX_MAIL_FROM}
      YANDEX_MAIL_FROM_NAME: ${YANDEX_MAIL_FROM_NAME:-Albus}
      YANDEX_SMTP_HOST: ${YANDEX_SMTP_HOST:-smtp.yandex.ru}
      YANDEX_SMTP_PORT: ${YANDEX_SMTP_PORT:-465}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      # bound to loopback: the reverse proxy is the only way in
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_media:/app/media
      # Daphne serves no static files, and WhiteNoise is WSGI only, so the
      # collectstatic output is bind mounted for the reverse proxy to serve.
      - /opt/albus/static:/app/staticfiles
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/auth/csrf/', timeout=5)\""]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    image: albus-frontend:latest
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
  redis_data:
  backend_media:
