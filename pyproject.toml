[tool.poetry]
name = "albus"
version = "1.0.0"
description = "Albus — Modern Real-Time Chat"
authors = ["Olga <solevla2016@gmail.com>"]
readme = "README.md"
packages = [{ include = "." }]

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.1"
channels = "^4.1"
channels-redis = "^4.2"
daphne = "^4.1"
psycopg2-binary = "^2.9"
redis = "^5.0"
djangorestframework = "^3.15"
django-cors-headers = "^4.4"
django-filter = "^24.3"
pillow = "^10.4"
python-dotenv = "^1.0"
gunicorn = "^22.0"
httpx = "^0.28"
whitenoise = "^6.7"
SpeechRecognition = "^3.10"
pydub = "^0.25"
imageio-ffmpeg = "^0.6"

[tool.poetry.group.dev.dependencies]
ruff = "^0.5"
pre-commit = "^3.7"
pytest = "^8.2"
pytest-django = "^4.8"
pytest-asyncio = "^1.4"
pytest-cov = "^7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S101", "S105", "S106"]
"conftest.py" = ["S101", "S106"]
"*/migrations/*" = ["RUF012"]
"users/models.py" = ["RUF012"]
"chat/models.py" = ["RUF012"]
"config/settings.py" = ["E402"]
"chat/speech_service.py" = ["S110"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["tests.py", "test_*.py"]
asyncio_mode = "auto"
testpaths = ["chat", "users"]
addopts = "--cov --cov-report=term-missing --cov-config=pyproject.toml"
markers = [
    "no_throttle: keep DRF rate limiting active for this test",
]

[tool.coverage.run]
source = ["chat", "users"]
branch = true
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/test_*",
    "chat/apps.py",
    "users/apps.py",
    "chat/admin.py",
    "users/admin.py",
    "chat/routing.py",
    "chat/speech_service.py",
]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
