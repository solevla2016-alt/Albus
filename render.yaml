services:
  - type: web
    name: albus-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: albus-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: albus-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://albus.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://albus.vercel.app"

  - type: redis
    name: albus-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  - name: albus-db
    plan: free
