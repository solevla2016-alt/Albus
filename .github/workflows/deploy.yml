name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current time
        id: time
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: docker build -t albus-frontend:latest -f Dockerfile.frontend --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} --build-arg NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }} ./frontend

      - name: Build backend image
        run: docker build -t albus-backend:latest -f Dockerfile.backend .

      - name: Save images to tar
        run: docker save albus-backend:latest albus-frontend:latest | gzip > albus-images.tar.gz

      - name: Free space on VDS before upload
        env:
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VDS_SSH_KEY_B64" | base64 -d > ~/.ssh/vds_key
          chmod 600 ~/.ssh/vds_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -p ${{ secrets.VDS_PORT || 22 }} ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} '
            set -e
            rm -f /tmp/albus-images.tar.gz
            apt-get clean || true
            rm -rf /var/lib/apt/lists/* || true
            journalctl --vacuum-size=32M || true
            # Only dangling images: -a would also delete dependency images
            # (postgres, redis, coturn) whenever their container is down.
            docker image prune -f >/dev/null 2>&1 || true
            docker builder prune -f >/dev/null 2>&1 || true
            df -h / | tail -1
          '

      - name: Upload images to VDS
        env:
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VDS_SSH_KEY_B64" | base64 -d > ~/.ssh/vds_key
          chmod 600 ~/.ssh/vds_key
          ls -lh albus-images.tar.gz
          echo "Uploading albus-images.tar.gz (may take a while)..."
          for i in 1 2 3 4 5; do
            if scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -P ${{ secrets.VDS_PORT || 22 }} albus-images.tar.gz ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/tmp/albus-images.tar.gz; then
              echo "upload OK"
              break
            fi
            echo "scp attempt $i failed, retrying..."
            sleep 10
          done
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -p ${{ secrets.VDS_PORT || 22 }} ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} "ls -lh /tmp/albus-images.tar.gz && gzip -t /tmp/albus-images.tar.gz && echo GZIP_OK"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -P ${{ secrets.VDS_PORT || 22 }} docker-compose.vds.yml ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/opt/albus/docker-compose.vds.yml
        timeout-minutes: 45

      - name: Load and redeploy on VDS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          command_timeout: "30m"
          script_stop: true
          script: |
            set -e
            apt-get clean || true
            # Old albus images lose their tag once the new ones are loaded and
            # become dangling, so the default prune removes them. Pruning with
            # -a would risk deleting images of stopped dependency containers.
            docker image prune -f >/dev/null 2>&1 || true
            cd /opt/albus
            df -h / | tail -1
            docker load -i /tmp/albus-images.tar.gz
            docker compose -f docker-compose.vds.yml up -d
            docker image prune -f >/dev/null 2>&1 || true
            docker compose -f docker-compose.vds.yml ps
            rm -f /tmp/albus-images.tar.gz

      - name: Cleanup and verify on VDS
        if: always()
        env:
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s' "$VDS_SSH_KEY_B64" | base64 -d > ~/.ssh/vds_key
          chmod 600 ~/.ssh/vds_key
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key -p ${{ secrets.VDS_PORT || 22 }} ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} '
            rm -f /tmp/albus-images.tar.gz
            cd /opt/albus
            echo "--- services ---"
            docker compose -f docker-compose.vds.yml ps --format "{{.Service}} | {{.Status}}" | sort
            echo "--- site ---"
            curl -s -o /dev/null -w "login HTTP %{http_code}\n" https://albus.duckdns.org/login
            echo "--- disk ---"
            df -h / | tail -1
            echo "--- images (tag + dangling) ---"
            docker images -a --format "{{.Repository}}:{{.Tag}} {{.Size}}" | sort
            echo "--- restart counts (should stay low) ---"
            for c in $(docker compose -f docker-compose.vds.yml ps -q); do
              docker inspect --format "{{.Name}} restarts={{.RestartCount}}" "$c"
            done
            docker inspect --format "{{.Name}} restarts={{.RestartCount}}" albus-turn-1 2>/dev/null || true
            echo "--- largest container logs ---"
            find /var/lib/docker/containers -name "*-json.log" -printf "%s %p\n" 2>/dev/null \
              | sort -rn | head -3 | awk "{printf \"%.1f MB %s\n\", \$1/1048576, \$2}"
          '

      - name: Report result
        if: always()
        run: echo "Deploy ${{ job.status }} at ${{ steps.time.outputs.now }}"