name: Deploy to VDS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get current time
        id: time
        run: echo "now=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      # No NEXT_PUBLIC_* build args: the frontend addresses /api and /ws
      # relative to its own origin, so the same image works on any hostname.
      - name: Build frontend image
        run: docker build -t albus-frontend:latest -f Dockerfile.frontend ./frontend

      - name: Build backend image
        run: docker build -t albus-backend:latest -f Dockerfile.backend .

      - name: Save images to tar
        run: docker save albus-backend:latest albus-frontend:latest | gzip > albus-images.tar.gz

      # One SSH mechanism for every remote step. appleboy/ssh-action wants the
      # raw private key in VDS_SSH_KEY, while the rest of the workflow already
      # reconstructs it from VDS_SSH_KEY_B64; keeping a single secret avoids the
      # two drifting apart.
      - name: Set up SSH key
        env:
          VDS_SSH_KEY_B64: ${{ secrets.VDS_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s' "$VDS_SSH_KEY_B64" | base64 -d > ~/.ssh/vds_key
          chmod 600 ~/.ssh/vds_key

      - name: Free space on VDS before upload
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
              -p ${{ secrets.VDS_PORT || 22 }} \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} '
            set -e
            rm -f /tmp/albus-images.tar.gz
            apt-get clean || true
            rm -rf /var/lib/apt/lists/* || true
            journalctl --vacuum-size=32M || true
            # Only dangling images: -a would also delete dependency images
            # (postgres, redis) whenever their container is down.
            docker image prune -f >/dev/null 2>&1 || true
            docker builder prune -f >/dev/null 2>&1 || true
            df -h / | tail -1
          '

      - name: Upload images to VDS
        run: |
          set -e
          ls -lh albus-images.tar.gz
          echo "Uploading albus-images.tar.gz (may take a while)..."
          for i in 1 2 3 4 5; do
            if scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
                   -P ${{ secrets.VDS_PORT || 22 }} albus-images.tar.gz \
                   ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/tmp/albus-images.tar.gz; then
              echo "upload OK"
              break
            fi
            if [ "$i" = "5" ]; then echo "scp failed after 5 attempts"; exit 1; fi
            echo "scp attempt $i failed, retrying..."
            sleep 10
          done
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
              -p ${{ secrets.VDS_PORT || 22 }} \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} \
              "ls -lh /tmp/albus-images.tar.gz && gzip -t /tmp/albus-images.tar.gz && echo GZIP_OK"
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
              -P ${{ secrets.VDS_PORT || 22 }} docker-compose.vds.yml \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }}:/opt/albus/docker-compose.vds.yml

      - name: Load and redeploy on VDS
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
              -p ${{ secrets.VDS_PORT || 22 }} \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} '
            set -e
            cd /opt/albus
            df -h / | tail -1
            docker load -i /tmp/albus-images.tar.gz
            docker compose -f docker-compose.vds.yml up -d
            docker image prune -f >/dev/null 2>&1 || true
            docker compose -f docker-compose.vds.yml ps
          '

      - name: Cleanup and verify on VDS
        if: always()
        run: |
          set -e
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/vds_key \
              -p ${{ secrets.VDS_PORT || 22 }} \
              ${{ secrets.VDS_USER }}@${{ secrets.VDS_HOST }} '
            rm -f /tmp/albus-images.tar.gz
            cd /opt/albus
            echo "--- services ---"
            docker compose -f docker-compose.vds.yml ps --format "{{.Service}} | {{.Status}}" | sort
            echo "--- site ---"
            curl -s -o /dev/null -w "login HTTP %{http_code}\n" https://albuschat.ru/login
            curl -s -o /dev/null -w "chat HTTP %{http_code}\n" https://albuschat.ru/chat
            curl -s -o /dev/null -w "csrf HTTP %{http_code}\n" https://albuschat.ru/api/auth/csrf/
            echo "--- disk ---"
            df -h / | tail -1
            echo "--- memory ---"
            free -h | head -2
            echo "--- images (tag + dangling) ---"
            docker images -a --format "{{.Repository}}:{{.Tag}} {{.Size}}" | sort
            echo "--- restart counts (should stay low) ---"
            for c in $(docker compose -f docker-compose.vds.yml ps -q); do
              docker inspect --format "{{.Name}} restarts={{.RestartCount}}" "$c"
            done
            # coturn runs as a systemd unit, not as a container
            echo "--- coturn ---"
            systemctl is-active coturn || true
            echo "--- largest container logs ---"
            find /var/lib/docker/containers -name "*-json.log" -printf "%s %p\n" 2>/dev/null \
              | sort -rn | head -3 | awk "{printf \"%.1f MB %s\n\", \$1/1048576, \$2}"
          '

      - name: Report result
        if: always()
        run: echo "Deploy ${{ job.status }} at ${{ steps.time.outputs.now }}"